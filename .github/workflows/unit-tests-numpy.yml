name: Numpy 1.x unit test
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '**'

jobs:

  build-and-test:
    name: unit-numpy
    runs-on: ubuntu-22.04
    if: github.event.pull_request.draft == false
    env:
      sundials-version: 'v7.9.0'

    steps:
      - uses: actions/checkout@v7

      - name: Configure Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install dependencies (except Sundials)
        run: |
          sudo .github/workflows/install-ubuntu-dependencies.sh

      - name: Check out Sundials ${{ env.sundials-version }}
        uses: actions/checkout@v7
        with:
          repository: LLNL/sundials
          path: sundials
          ref: ${{ env.sundials-version }}

      - name: Install Sundials ${{ env.sundials-version }}
        run: |
          .github/workflows/install-sundials-manually.sh

      - name: Install Numpy 1.x
        run: |
          python -m pip install "numpy<2"

      - name: Install Myokit
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install .[optional]
          python .github/workflows/select-opencl-device.py

      - name: Show Myokit info
        run: |
          python -m myokit system
          python -m myokit opencl

      - name: Run unit tests
        run: |
          python -m myokit test unit

